---
name: dev-deployment

on:
  push:
    branches:
      - main

jobs:
  dockerbuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWOD }}
      
      - name: short commit tag
        run : echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_ENV 


      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./app
          push: true
          tags: |
              ${{ vars.DOCKER_USERNAME }}/web-app3:${{ env.short_tag }}


      
  Deploy:
    runs-on: ubuntu-latest
    needs: dockerbuild
    steps:
      - name: setup for ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << EOF
            cd /home/ubuntu/ali-final-task/app
            sudo docker compose restart
          EOF