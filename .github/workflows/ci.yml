---
name: dev-deployment

on:
  push:
    branches:
      - main

jobs:
  dockerbuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t web-app3:1.0 ./app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ali00mohamed
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: docker tag web-app3:1.0 ali00mohamed/m:1.0

      - name: Push Docker image
        run: docker push ali00mohamed/web-app3:1.0
